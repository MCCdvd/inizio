initial_balance: 10000

training:
  episodes: 50
  batch_size: 32
  checkpoint_interval: 10
  seed: 42
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001

objective:
  primary_metric: "sharpe_ratio"

data:
  tickers:
    - "AAPL"       # Apple
    - "KO"         # Coca-Cola
    - "MSFT"       # Microsoft
    - "AMZN"       # Amazon
    - "STLA"       # Stellantis
    - "BAS.DE"     # BASF (Xetra)
    # Sun Chemical is a privately held company and has no stock ticker
  start: "2020-01-01"
  end: "2026-06-30"
  split_ratio: 0.8
  timeframe: "1D"
  fill_missing: true
  outlier_zscore_threshold: 4.0

features:
  indicators: ["all"]
  volume_profile_lookback: 30

env:
  window_size: 30
  initial_balance: 10000
  drawdown_penalty: 0.1
  trade_bonus: 0.05
  hold_penalty: 0.001
  risk_reward_weight: 0.05
  max_hold_steps: 20
  commission_pct: 0.001
  slippage_pct: 0.0005
  overtrade_penalty: 0.001
  stop_loss_pct: 0.05
  take_profit_pct: 0.1

dqn:
  gamma: 0.99
  lr: 0.001
  epsilon_start: 1.0
  epsilon_decay: 0.995
  epsilon_min: 0.01
  memory_size: 20000
  target_update_freq: 100
  batch_size: 32
  model_dir: "one/models/dqn"

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  actor_lr: 0.0003
  critic_lr: 0.001
  epochs: 10
  minibatch_size: 64
  continuous_actions: false
  model_dir: "one/models/ppo"

logging:
  level: "INFO"
  file: "one/logs/train.log"

output:
  metrics_csv: "one/training_metrics.csv"
  plot: true
  leaderboard_csv: "one/leaderboard.csv"
  walk_forward_csv: "one/walk_forward_report.csv"
  retrain_status_json: "one/retrain_status.json"

backtest:
  compare_agents: ["dqn", "ppo"]
  models:
    dqn: "one/models/dqn/best_model.keras"
    ppo: "one/models/ppo/best_model"
  report_csv: "one/backtest_report.csv"

search:
  max_trials: 4
  grid:
    dqn:
      gamma: [0.95, 0.99]
      lr: [0.001, 0.0005]
    ppo:
      actor_lr: [0.0003, 0.0001]
      clip_ratio: [0.2, 0.1]

validation:
  walk_forward_folds: 3
  retrain_degradation_threshold: 0.05
